<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>세무사 권오성 · 보라 3 리본형 가로</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; width: 1200px; height: 400px; overflow: hidden; background: #fff; }
  body { font-family: 'Pretendard', sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .poster { position: relative; width: 1200px; height: 400px; overflow: hidden; background: #fff; display: flex; align-items: stretch; }

  .left { flex: 1; min-width: 0; padding: 36px 40px; display: flex; flex-direction: column; justify-content: space-between; }
  .toprow { display: flex; align-items: center; gap: 28px; }
  .chip { flex: none; width: 220px; height: 84px; background: #F6F3FF; border-radius: 18px; display: flex; align-items: center; justify-content: center; }
  .chip img { width: 184px; height: auto; display: block; }
  .name { font-size: 26px; font-weight: 800; color: #160A33; letter-spacing: -0.03em; }
  .name small { font-weight: 600; opacity: 0.7; margin-right: 8px; }
  .headline { }
  .headline .l1 { display: block; font-size: 56px; line-height: 1.0; font-weight: 900; color: #160A33; letter-spacing: -0.05em; }
  .headline .l2 { display: block; margin-top: 2px; font-size: 100px; line-height: 0.92; font-weight: 900; color: #6B2BFF; letter-spacing: -0.06em; }
  .foot { border-top: 2px solid #E3E6EC; padding-top: 10px; }
  .foot b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; color: #160A33; }
  .foot span { display: block; margin-top: 2px; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; color: rgba(22,10,51,0.55); }

  .ribbon { position: relative; flex: none; width: 460px; background: #B8F3FF; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 28px; }
  .ribbon::before, .ribbon::after {
    content: ""; position: absolute; left: -28px; width: 0; height: 0;
    border-right: 28px solid #3A18B0;
  }
  .ribbon::before { top: 0; border-bottom: 36px solid transparent; }
  .ribbon::after { bottom: 0; border-top: 36px solid transparent; }
  .r-label { font-size: 22px; font-weight: 800; color: #160A33; letter-spacing: -0.03em; text-align: center; line-height: 1.3; }
  .r-mega { margin-top: 4px; font-size: 168px; line-height: 0.88; font-weight: 900; color: #6B2BFF; letter-spacing: -0.08em; }
</style>
</head>
<body>
<div class="poster">
  <div class="left">
    <div class="toprow">
      <div class="chip"><img src="logo.png" alt="AI BUILDERS LAB"></div>
      <p class="name"><small>세무사</small>권오성</p>
    </div>
    <h1 class="headline"><span class="l1">수원 1등</span><span class="l2">세무사</span></h1>
    <div class="foot"><b>AI BUILDERS LAB</b><span>MEMBER BENEFIT</span></div>
  </div>
  <div class="ribbon">
    <div class="r-label">AI빌더스랩 회원 첫 세무상담</div>
    <div class="r-mega">무료</div>
  </div>
</div>
</body>
</html>
