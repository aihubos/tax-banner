<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>세무사 회원 특가 · 시안 A 가로</title>
<script src="content.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 400px; margin: 0; overflow: hidden; background: #fff; }
  body { font-family: 'Pretendard', sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .poster { position: relative; width: 1200px; height: 400px; overflow: hidden; background: #fff; display: flex; }

  /* 좌 화이트 */
  .left { width: 668px; padding: 40px 48px 40px 52px; display: flex; flex-direction: column; position: relative; }
  .logo { width: 200px; height: auto; display: block; margin-left: -3px; }
  .rule { height: 2px; background: #E3E6EC; margin: 22px 0 26px; }
  .badge { align-self: flex-start; display: inline-flex; align-items: center; height: 40px; padding: 0 20px; border-radius: 20px;
           background: #EAF0FF; color: #1E5EFF; font-size: 18px; font-weight: 700; letter-spacing: -0.02em;
           box-shadow: 0 2px 5px rgba(16,34,79,0.12); }
  .name { margin-top: 18px; font-size: 82px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; color: #10224F; white-space: nowrap; }
  .name em { font-style: normal; color: #1E5EFF; }
  .bar { width: 44px; height: 7px; border-radius: 4px; background: #1E5EFF; margin-top: 18px; }
  .card { position: absolute; right: 48px; top: 196px; width: 100px; height: 100px; border-radius: 24px; background: #EAF0FF;
          box-shadow: 0 5px 12px rgba(16,34,79,0.14); display: flex; align-items: center; justify-content: center; }
  .card svg { width: 58px; height: 58px; }

  /* 우 블루 */
  .block { flex: 1; background: #1E5EFF; color: #fff; padding: 40px 48px 34px; display: flex; flex-direction: column; }
  .lead { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .lead b { color: #D8FF6A; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; display: block; margin-bottom: 4px; }
  .offer-wrap { margin-top: 16px; border: 2px dashed rgba(216,255,106,0.75); border-radius: 16px; padding: 14px 20px; min-height: 96px;
                display: flex; align-items: center; }
  .offer { display: block; color: #D8FF6A; font-size: 30px; font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; text-wrap: balance; }
  .cta { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .cta p { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
  .cta small { display: block; text-align: right; font-size: 18px; font-weight: 600; line-height: 1.3; opacity: .8; white-space: nowrap; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="poster">
  <section class="left">
    <img class="logo" src="logo.png" alt="AI BUILDERS LAB">
    <div class="rule"></div>
    <div class="badge">AI빌더스랩 회원 전용</div>
    <div class="name"><em>세무사</em> 권오성</div>
    <div class="bar"></div>
    <div class="card" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" stroke="#1E5EFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 6h22l12 12v36a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z"/>
        <path d="M38 6v12h12"/>
        <path d="M21 26h16M21 34h22"/>
        <path d="M22 45l6 6 12-12"/>
      </svg>
    </div>
  </section>

  <section class="block">
    <p class="lead"><b>회원 특가</b></p>
    <div class="offer-wrap"><span class="offer" data-slot="offer">[회원 특가 내용 입력]</span></div>
    <div class="cta">
      <p>문의는 AI빌더스랩<br>운영진에게</p>
      <small>AI BUILDERS LAB<br>MEMBER BENEFIT</small>
    </div>
  </section>
</div>
</body>
</html>
