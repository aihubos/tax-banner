<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="content.js"></script>
<title>세무사 회원 특가 · 시안 C 울트라 바이올렛 가로</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; width: 1200px; height: 400px; overflow: hidden; background: #6B2BFF; }
  body { font-family: 'Pretendard', sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .poster {
    position: relative; width: 1200px; height: 400px; overflow: hidden; background: #6B2BFF; color: #fff;
    display: flex; align-items: stretch; padding: 36px 40px;
  }

  .left { flex: none; width: 240px; display: flex; flex-direction: column; justify-content: space-between; }
  .chip { width: 240px; height: 100px; background: #fff; border-radius: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(40,10,120,0.25); }
  .chip img { width: 200px; height: auto; display: block; }
  .foot { border-top: 2px solid rgba(255,255,255,0.36); padding-top: 14px; }
  .foot b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .foot span { display: block; margin-top: 4px; font-size: 18px; font-weight: 500; letter-spacing: 0.04em; color: rgba(255,255,255,0.82); }

  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 20px 0 36px; min-width: 0; }
  .badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; height: 34px; padding: 0 14px;
    background: #EEE8FF; color: #6B2BFF; border-radius: 17px; font-size: 15px; font-weight: 700; letter-spacing: -0.02em;
  }
  .deal-badge {
    display: inline-flex; align-items: center; height: 34px; padding: 0 14px;
    background: #B8F3FF; color: #160A33; border-radius: 17px; font-size: 15px; font-weight: 800; letter-spacing: -0.02em;
  }
  .stats {
    margin-top: 12px; font-size: 20px; line-height: 1.3; font-weight: 800;
    color: #D8FF6A; letter-spacing: -0.02em; white-space: nowrap;
  }
  .headline {
    margin-top: 8px; font-size: 42px; line-height: 1.16; font-weight: 800;
    color: #fff; letter-spacing: -0.04em;
  }
  .headline span { display: block; white-space: nowrap; }

  .right { flex: none; width: 400px; display: flex; flex-direction: column; justify-content: center; }
  .offer-card { background: #fff; border-radius: 20px; padding: 12px 14px 14px; box-shadow: 0 12px 28px rgba(40,10,120,0.28); }
  .offer-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #6B2BFF; letter-spacing: -0.02em; }
  .offer-label .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #6B2BFF; }
  .offer-label small { font-weight: 600; font-size: 1em; }
  .offer-box {
    margin-top: 8px; padding: 2px 14px;
    border: 2px dashed #C4B0FF; border-radius: 12px; background: #F6F3FF;
    display: flex; flex-direction: column;
  }
  .price-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
  .price-row + .price-row { border-top: 1px solid #E0D6FF; }
  .price-name { font-size: 16px; font-weight: 700; color: #10224F; letter-spacing: -0.02em; }
  .price-val { font-size: 26px; font-weight: 800; color: #6B2BFF; letter-spacing: -0.03em; white-space: nowrap; }
  .cta {
    margin-top: 12px; height: 52px; border-radius: 26px; background: #B8F3FF; color: #160A33;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 20px; font-weight: 800; letter-spacing: -0.03em;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="left">
    <div class="chip"><img src="logo.png" alt="AI BUILDERS LAB"></div>
    <div class="foot"><b>AI BUILDERS LAB</b><span>MEMBER BENEFIT</span></div>
  </div>

  <div class="center">
    <div class="badges">
      <span class="badge">AI빌더스랩 회원 전용</span>
      <span class="deal-badge">회원 특가</span>
    </div>
    <p class="stats">신고건수 4,000건+, 누적절세액 5억+</p>
    <h1 class="headline"><span>AI빌더스랩 제휴 업체</span><span>세무사 권오성</span></h1>
  </div>

  <div class="right">
    <div class="offer-card">
      <div class="offer-label"><span class="dot"></span><span>AI빌더스랩 회원 전용 특가 <small>(부가세포함)</small></span></div>
      <div class="offer-box">
        <div class="price-row"><span class="price-name">개인 기장료</span><span class="price-val">66,000원 ~</span></div>
        <div class="price-row"><span class="price-name">법인 기장료</span><span class="price-val">118,800원 ~</span></div>
      </div>
    </div>
    <div class="cta">문의는 AI빌더스랩 운영진에게
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#160A33" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </div>
</div>
</body>
</html>
