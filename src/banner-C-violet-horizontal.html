<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="content.js"></script>
<title>세무사 회원 특가 · 시안 C 울트라 바이올렛 가로</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; width: 1200px; height: 400px; overflow: hidden; background: #6B2BFF; }
  body { font-family: 'Pretendard', sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .poster {
    position: relative; width: 1200px; height: 400px; overflow: hidden; background: #6B2BFF; color: #fff;
    display: flex; align-items: stretch; padding: 40px 44px;
  }

  .left { flex: none; width: 260px; display: flex; flex-direction: column; justify-content: space-between; }
  .chip { width: 260px; height: 108px; background: #fff; border-radius: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(40,10,120,0.25); }
  .chip img { width: 216px; height: auto; display: block; }
  .foot { border-top: 2px solid rgba(255,255,255,0.36); padding-top: 14px; }
  .foot b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .foot span { display: block; margin-top: 4px; font-size: 18px; font-weight: 500; letter-spacing: 0.04em; color: rgba(255,255,255,0.82); }

  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 24px 0 44px; }
  .badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; height: 36px; padding: 0 16px;
    background: #EEE8FF; color: #6B2BFF; border-radius: 18px; font-size: 16px; font-weight: 700; letter-spacing: -0.02em;
  }
  .deal-badge {
    display: inline-flex; align-items: center; height: 36px; padding: 0 16px;
    background: #B8F3FF; color: #160A33; border-radius: 18px; font-size: 16px; font-weight: 800; letter-spacing: -0.02em;
  }
  .mega { margin-top: 10px; font-weight: 900; color: #B8F3FF; letter-spacing: -0.06em; }
  .mega .l1, .mega .l2 { display: block; line-height: 0.95; white-space: nowrap; }
  .mega .l1 { font-size: 52px; }
  .mega .l2 { font-size: 80px; }
  .mega em { font-style: normal; color: #160A33;
             background: linear-gradient(transparent 58%, #D8FF6A 58%, #D8FF6A 94%, transparent 94%); }
  .bar { margin-top: 14px; width: 64px; height: 8px; border-radius: 4px; background: #B8F3FF; }

  .right { flex: none; width: 384px; display: flex; flex-direction: column; justify-content: center; }
  .name { font-size: 46px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; white-space: nowrap; }
  .name small { font-size: 46px; font-weight: 600; opacity: 0.9; margin-right: 12px; }
  .offer-card { margin-top: 18px; background: #fff; border-radius: 20px; padding: 10px; box-shadow: 0 12px 28px rgba(40,10,120,0.28); }
  .offer-box {
    min-height: 0; padding: 12px 16px; border: 3px dashed #C4B0FF; border-radius: 14px; background: #F6F3FF;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3px;
  }
  .offer-kicker { font-size: 15px; font-weight: 700; color: #6B2BFF; letter-spacing: -0.02em; }
  .offer-main { font-size: 28px; line-height: 1.15; font-weight: 800; color: #10224F; letter-spacing: -0.03em; }
  .offer-main em { font-style: normal; color: #6B2BFF; }
  .offer-note { font-size: 14px; font-weight: 600; color: #55607A; letter-spacing: -0.02em; }
  .cta {
    margin-top: 16px; height: 56px; border-radius: 28px; background: #B8F3FF; color: #160A33;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 22px; font-weight: 800; letter-spacing: -0.03em;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="left">
    <div class="chip"><img src="logo.png" alt="AI BUILDERS LAB"></div>
    <div class="foot"><b>AI BUILDERS LAB</b><span>MEMBER BENEFIT</span></div>
  </div>

  <div class="center">
    <div class="badges">
      <span class="badge">AI빌더스랩 회원 전용</span>
      <span class="deal-badge">회원 특가</span>
    </div>
    <h1 class="mega"><span class="l1">수원 <em>1등</em></span><span class="l2">세무사</span></h1>
    <div class="bar"></div>
  </div>

  <div class="right">
    <div class="name"><small>세무사</small>권오성</div>
    <div class="offer-card">
      <div class="offer-box">
        <div class="offer-kicker" data-slot="offer-label">AI빌더스랩 회원 전용</div>
        <div class="offer-main" data-slot="offer-main">월 기장료 <em>10%</em> 할인</div>
        <div class="offer-note" data-slot="offer-note">(최소 1만원 적용)</div>
      </div>
    </div>
    <div class="cta">문의는 AI빌더스랩 운영진에게
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#160A33" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </div>
</div>
</body>
</html>
