<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>세무사 권오성 · 보라 1 쿠폰형 세로</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; width: 1080px; height: 3240px; overflow: hidden; background: #fff; }
  body { font-family: 'Pretendard', sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .poster { position: relative; width: 1080px; height: 3240px; overflow: hidden; background: #fff; }

  .top { height: 1040px; padding: 96px 80px 0; }
  .logo { display: block; width: 520px; height: auto; }
  .rule { height: 6px; background: #E3E6EC; border-radius: 3px; margin: 72px 0 64px; }
  .headline { }
  .headline .l1 { display: block; font-size: 152px; line-height: 1.0; font-weight: 900; color: #160A33; letter-spacing: -0.06em; }
  .headline .l2 { display: block; margin-top: 8px; font-size: 268px; line-height: 0.92; font-weight: 900; color: #6B2BFF; letter-spacing: -0.07em; }
  .name { margin-top: 36px; font-size: 56px; line-height: 1.1; font-weight: 800; color: #160A33; letter-spacing: -0.03em; }
  .name small { font-size: 56px; font-weight: 600; opacity: 0.7; margin-right: 16px; }

  .bottom { position: absolute; left: 0; right: 0; top: 1040px; bottom: 0; background: #6B2BFF; color: #fff; padding: 80px 80px 72px; display: flex; flex-direction: column; }
  .ticket-wrap { flex: none; height: 1560px; filter: drop-shadow(0 24px 48px rgba(22,10,51,0.28)); }
  .ticket {
    width: 100%; height: 100%; border-radius: 48px; overflow: hidden; display: flex; flex-direction: column;
    -webkit-mask:
      radial-gradient(circle at 0 420px, transparent 36px, #000 37px),
      radial-gradient(circle at 100% 420px, transparent 36px, #000 37px);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
  }
  .t-top { height: 420px; background: #160A33; color: #fff; padding: 0 72px; display: flex; flex-direction: column; justify-content: center; }
  .t-kicker { font-size: 36px; font-weight: 700; letter-spacing: 0.08em; color: #B8F3FF; }
  .t-member { margin-top: 16px; font-size: 72px; line-height: 1.2; font-weight: 800; letter-spacing: -0.03em; }
  .t-bot { position: relative; flex: 1; background: #fff; padding: 80px 72px 64px; display: flex; flex-direction: column; justify-content: center; }
  .t-bot::before { content: ""; position: absolute; left: 72px; right: 72px; top: 0; border-top: 6px dashed #C4B0FF; }
  .t-sub { font-size: 64px; font-weight: 800; color: #6B2BFF; letter-spacing: -0.03em; }
  .t-mega { margin-top: 8px; font-size: 400px; line-height: 0.9; font-weight: 900; color: #6B2BFF; letter-spacing: -0.07em; }

  .cta {
    margin-top: 48px; height: 120px; border-radius: 60px; background: #B8F3FF; color: #160A33;
    display: flex; align-items: center; justify-content: center; gap: 20px;
    font-size: 44px; font-weight: 800; letter-spacing: -0.03em;
  }
  .foot { margin-top: auto; border-top: 2px solid rgba(255,255,255,0.36); padding-top: 36px; }
  .foot b { display: block; font-size: 40px; font-weight: 800; letter-spacing: -0.01em; }
  .foot span { display: block; margin-top: 8px; font-size: 28px; font-weight: 500; letter-spacing: 0.04em; color: rgba(255,255,255,0.82); }
</style>
</head>
<body>
<div class="poster">
  <section class="top">
    <img class="logo" src="logo.png" alt="AI BUILDERS LAB">
    <div class="rule"></div>
    <h1 class="headline"><span class="l1">수원 1등</span><span class="l2">세무사</span></h1>
    <p class="name"><small>세무사</small>권오성</p>
  </section>
  <section class="bottom">
    <div class="ticket-wrap">
      <div class="ticket">
        <div class="t-top">
          <div class="t-kicker">MEMBER BENEFIT</div>
          <div class="t-member">AI빌더스랩 회원</div>
        </div>
        <div class="t-bot">
          <div class="t-sub">첫 세무상담</div>
          <div class="t-mega">무료</div>
        </div>
      </div>
    </div>
    <div class="cta">문의는 AI빌더스랩 운영진에게
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#160A33" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
    <div class="foot"><b>AI BUILDERS LAB</b><span>MEMBER BENEFIT</span></div>
  </section>
</div>
</body>
</html>
