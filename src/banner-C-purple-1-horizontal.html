<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>세무사 권오성 · 보라 1 쿠폰형 가로</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; width: 1200px; height: 400px; overflow: hidden; background: #6B2BFF; }
  body { font-family: 'Pretendard', sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .poster { position: relative; width: 1200px; height: 400px; overflow: hidden; background: #6B2BFF; color: #fff; display: flex; align-items: stretch; padding: 36px 40px; }
  .left { flex: none; width: 248px; display: flex; flex-direction: column; justify-content: space-between; }
  .chip { width: 248px; height: 100px; background: #fff; border-radius: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(22,10,51,0.25); }
  .chip img { width: 200px; height: auto; display: block; }
  .foot { border-top: 2px solid rgba(255,255,255,0.36); padding-top: 12px; }
  .foot b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .foot span { display: block; margin-top: 3px; font-size: 16px; font-weight: 500; letter-spacing: 0.04em; color: rgba(255,255,255,0.82); }

  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 28px 0 36px; }
  .name { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }
  .name small { font-weight: 600; opacity: 0.85; margin-right: 8px; }
  .headline .l1 { display: block; font-size: 52px; line-height: 1.0; font-weight: 900; color: #fff; letter-spacing: -0.05em; }
  .headline .l2 { display: block; margin-top: 4px; font-size: 92px; line-height: 0.92; font-weight: 900; color: #B8F3FF; letter-spacing: -0.06em; }

  .ticket-wrap { flex: none; width: 420px; filter: drop-shadow(0 12px 24px rgba(22,10,51,0.28)); }
  .ticket {
    width: 100%; height: 100%; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column;
    -webkit-mask:
      radial-gradient(circle at 0 96px, transparent 18px, #000 19px),
      radial-gradient(circle at 100% 96px, transparent 18px, #000 19px);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
  }
  .t-top { height: 96px; background: #160A33; color: #fff; padding: 0 28px; display: flex; flex-direction: column; justify-content: center; }
  .t-kicker { font-size: 14px; font-weight: 700; letter-spacing: 0.08em; color: #B8F3FF; }
  .t-member { margin-top: 4px; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
  .t-bot { position: relative; flex: 1; background: #fff; padding: 22px 28px 18px; display: flex; flex-direction: column; justify-content: center; }
  .t-bot::before { content: ""; position: absolute; left: 28px; right: 28px; top: 0; border-top: 4px dashed #C4B0FF; }
  .t-sub { font-size: 22px; font-weight: 800; color: #6B2BFF; letter-spacing: -0.03em; }
  .t-mega { margin-top: 0; font-size: 108px; line-height: 0.9; font-weight: 900; color: #6B2BFF; letter-spacing: -0.07em; }
</style>
</head>
<body>
<div class="poster">
  <div class="left">
    <div class="chip"><img src="logo.png" alt="AI BUILDERS LAB"></div>
    <div class="foot"><b>AI BUILDERS LAB</b><span>MEMBER BENEFIT</span></div>
  </div>
  <div class="center">
    <p class="name"><small>세무사</small>권오성</p>
    <h1 class="headline"><span class="l1">수원 1등</span><span class="l2">세무사</span></h1>
  </div>
  <div class="ticket-wrap">
    <div class="ticket">
      <div class="t-top">
        <div class="t-kicker">MEMBER BENEFIT</div>
        <div class="t-member">AI빌더스랩 회원</div>
      </div>
      <div class="t-bot">
        <div class="t-sub">첫 세무상담</div>
        <div class="t-mega">무료</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
